# Docker Compose configuration para desenvolvimento local com PostgreSQL

services:
  postgres:
    image: postgres:17-alpine
    container_name: dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev-user
      POSTGRES_PASSWORD: dev-password-123
      POSTGRES_DB: dev-db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev-user']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
networks:
  dev-network:
    driver: bridge
